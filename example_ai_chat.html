<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>워크가이드 - 직업훈련 대응 챗봇</title>

  <style>
    :root {
      --panel: #ffffff;
      --ink: #1f2937;
      --muted: #6b7280;
      --line: #e5e7eb;
      --primary: #3559e0;
      --soft: #eef2ff;
      --success: #14855f;
      --shadow: 0 12px 36px rgba(20, 31, 61, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family:
        Pretendard,
        "Noto Sans KR",
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: linear-gradient(
        135deg,
        #f8faff,
        #f3f6fb 58%,
        #edf2ff
      );
    }

    button,
    textarea {
      font: inherit;
    }

    .app {
      width: min(1180px, 100%);
      min-height: 100vh;
      margin: auto;
      padding: 22px;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 18px;
    }

    .panel {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-height: 720px;
    }

    .brand {
      padding: 24px 22px 18px;
      border-bottom: 1px solid var(--line);
    }

    .brand-row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .logo {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: #ffffff;
      font-weight: 800;
      font-size: 22px;
      background: linear-gradient(135deg, #3559e0, #7182ef);
    }

    h1 {
      font-size: 20px;
      margin: 0;
    }

    .brand p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .side {
      padding: 18px;
    }

    .label {
      font-size: 12px;
      color: #8b93a7;
      font-weight: 800;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }

    .scenario {
      width: 100%;
      border: 1px solid var(--line);
      background: #ffffff;
      border-radius: 14px;
      padding: 13px 14px;
      margin-bottom: 9px;
      text-align: left;
      cursor: pointer;
      display: flex;
      gap: 10px;
      transition: 0.18s;
    }

    .scenario:hover,
    .scenario.active {
      border-color: var(--primary);
      background: var(--soft);
      transform: translateY(-1px);
    }

    .scenario .emoji {
      font-size: 20px;
    }

    .scenario b {
      display: block;
      font-size: 14px;
      margin-bottom: 3px;
    }

    .scenario small {
      display: block;
      color: var(--muted);
      line-height: 1.4;
    }

    .note {
      margin: auto 18px 18px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #f7f8fb;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .chat {
      min-height: 720px;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .header {
      padding: 20px 22px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .assistant {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #e9edff;
      font-size: 22px;
    }

    .assistant h2 {
      margin: 0;
      font-size: 17px;
    }

    .status {
      margin-top: 4px;
      font-size: 12px;
      color: var(--success);
    }

    .reset {
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--muted);
      padding: 9px 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    .messages {
      padding: 24px;
      overflow-y: auto;
      max-height: 650px;
      scroll-behavior: smooth;
    }

    .message {
      display: flex;
      margin-bottom: 18px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 84%;
      padding: 14px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.65;
    }

    .bot .bubble {
      background: #f4f6fb;
      border: 1px solid #edf0f6;
      border-top-left-radius: 6px;
    }

    .user .bubble {
      background: var(--primary);
      color: #ffffff;
      border-top-right-radius: 6px;
    }

    .welcome {
      background: linear-gradient(135deg, #f8faff, #eef2ff);
      border: 1px solid #dfe5ff;
      border-radius: 18px;
      padding: 18px;
    }

    .welcome h3 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .welcome p {
      margin: 0;
      color: #526078;
      font-size: 13px;
      line-height: 1.6;
    }

    .quick {
      padding: 0 24px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .quick button {
      border: 1px solid #cdd5f8;
      background: #ffffff;
      color: #3347a9;
      border-radius: 999px;
      padding: 9px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    .composer {
      border-top: 1px solid var(--line);
      padding: 16px 18px 18px;
    }

    .inputbox {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: end;
      border: 1px solid #d9deea;
      border-radius: 16px;
      padding: 8px 8px 8px 14px;
    }

    .inputbox:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(53, 89, 224, 0.08);
    }

    textarea {
      border: 0;
      outline: 0;
      resize: none;
      min-height: 42px;
      max-height: 110px;
      padding: 10px 0;
      background: transparent;
    }

    .send {
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 13px;
      background: var(--primary);
      color: #ffffff;
      cursor: pointer;
      font-size: 18px;
    }

    .helper {
      font-size: 11px;
      color: #949baa;
      margin: 8px 4px 0;
    }

    .typing {
      display: inline-flex;
      gap: 4px;
    }

    .typing i {
      width: 6px;
      height: 6px;
      background: #9aa2b2;
      border-radius: 50%;
      animation: bounce 1s infinite;
    }

    .typing i:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing i:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes bounce {
      0%,
      80%,
      100% {
        transform: translateY(0);
      }

      40% {
        transform: translateY(-5px);
      }
    }

    @media (max-width: 820px) {
      .app {
        grid-template-columns: 1fr;
        padding: 10px;
      }

      .sidebar {
        min-height: auto;
      }

      .side {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .label {
        grid-column: 1 / -1;
      }

      .scenario {
        margin: 0;
      }

      .note {
        display: none;
      }

      .chat {
        min-height: 680px;
      }
    }

    @media (max-width: 520px) {
      .side {
        grid-template-columns: 1fr;
      }

      .messages {
        padding: 16px 14px;
      }

      .quick {
        padding-left: 14px;
        padding-right: 14px;
      }

      .bubble {
        max-width: 94%;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <aside class="panel sidebar">
      <div class="brand">
        <div class="brand-row">
          <div class="logo">W</div>

          <div>
            <h1>워크가이드</h1>
            <p>직업훈련 대응 챗봇</p>
          </div>
        </div>
      </div>

      <div class="side">
        <div class="label">상황별 빠른 연습</div>

        <button class="scenario" data-key="order">
          <span class="emoji">🥤</span>
          <span>
            <b>음료 제조 실수</b>
            <small>잘못 만든 음료를 발견했어요.</small>
          </span>
        </button>

        <button class="scenario" data-key="delay">
          <span class="emoji">⏱️</span>
          <span>
            <b>서비스 지연·고객 화남</b>
            <small>고객이 큰 목소리로 항의해요.</small>
          </span>
        </button>

        <button class="scenario" data-key="harassment">
          <span class="emoji">🛡️</span>
          <span>
            <b>직장 내 성희롱</b>
            <small>불쾌한 말이나 행동을 겪었어요.</small>
          </span>
        </button>

        <button class="scenario" data-key="smalltalk">
          <span class="emoji">💬</span>
          <span>
            <b>동료와 스몰토크</b>
            <small>무슨 말을 해야 할지 모르겠어요.</small>
          </span>
        </button>
      </div>

      <div class="note">
        직업훈련용 연습 목업입니다. 긴급하거나 위험한 상황에서는
        현장 책임자, 보호자 또는 관련 전문기관에 즉시 도움을 요청하세요.
      </div>
    </aside>

    <section class="panel chat">
      <header class="header">
        <div class="assistant">
          <div class="avatar">🤖</div>

          <div>
            <h2>대응 도우미</h2>
            <div class="status">● 훈련 모드</div>
          </div>
        </div>

        <button class="reset" id="reset">처음부터</button>
      </header>

      <div class="messages" id="messages">
        <div class="message bot">
          <div class="bubble">
            <div class="welcome">
              <h3>어떤 상황이 발생했나요?</h3>

              <p>
                왼쪽에서 상황을 선택하거나 아래 입력창에 문제를 자유롭게
                입력하세요. 상황을 선택한 뒤 이어서 질문해 보세요.
                이전 상황을 기억하는 것처럼 답변합니다.
              </p>
            </div>
          </div>
        </div>
      </div>

      <div>
        <div class="quick" id="quickButtons"></div>

        <div class="composer">
          <div class="inputbox">
            <textarea
              id="input"
              placeholder="예: 고객이 주문이 늦다며 화를 내고 있어요"
            ></textarea>

            <button class="send" id="send" aria-label="보내기">➤</button>
          </div>

          <div class="helper">
            Enter로 전송 · Shift+Enter로 줄바꿈
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const conversations = {
      order: {
        title: "음료 제조 실수 대응",

        first:
          "주문 내용과 실제로 만든 음료가 어떻게 다른지 먼저 확인해 보세요. 고객에게 짧게 사과한 뒤 새 음료를 만드는 것이 좋습니다.",

        replies: [
          {
            test: /뭘 잘못|제가 잘못|내가 잘못|문제였|왜 잘못/,
            answer:
              "주문서를 만들기 전에 충분히 확인하지 않은 점이 문제였을 수 있어요. 하지만 실수 자체보다 발견한 뒤 어떻게 대응하는지가 더 중요합니다."
          },
          {
            test: /뭐라고|말해야|말하면|사과|예시/,
            answer:
              "“죄송합니다. 제가 주문 내용을 잘못 확인했습니다. 바로 새로 만들어 드리겠습니다. 약 3분 정도 걸립니다.”라고 말해 보세요."
          },
          {
            test: /다시 만들|재제조/,
            answer:
              "네. 주문과 다른 음료라면 가능한 한 바로 새로 만드는 것이 좋아요. 예상 시간을 함께 알려 주면 고객도 상황을 이해하기 쉽습니다."
          },
          {
            test: /점장|관리자|알려|말씀/,
            answer:
              "혼자 해결하기 어렵거나 고객의 항의가 커지면 점장님이나 관리자에게 바로 알려 주세요. 반복된 실수라면 원인도 함께 공유하는 것이 좋습니다."
          },
          {
            test: /화.*내|계속 화|소리|항의/,
            answer:
              "고객의 말을 끊지 말고 짧게 사과한 뒤 해결 방법을 반복해서 안내하세요. 욕설이나 위협이 계속되면 혼자 대응하지 말고 관리자에게 도움을 요청하세요."
          },
          {
            test: /다음부터|실수하지|예방|어떻게 해야/,
            answer:
              "음료를 만들기 전에 메뉴, 옵션, 수량을 한 번 확인하고 완성 후 주문서와 다시 비교하는 습관을 만들어 보세요."
          }
        ]
      },

      delay: {
        title: "서비스 지연·화난 고객 대응",

        first:
          "서비스가 지연된 사실을 먼저 인정하고 고객의 말을 차분히 들어 주세요. 짧게 사과한 뒤 현재 주문 상태와 예상 시간을 알려 주는 것이 좋습니다.",

        replies: [
          {
            test: /뭘 잘못|제가 잘못|내가 잘못|책임/,
            answer:
              "모든 책임이 혼자에게 있다는 뜻은 아니에요. 다만 고객이 오래 기다린 상황을 빨리 확인하고 예상 시간을 안내하지 못한 점은 개선할 수 있습니다."
          },
          {
            test: /계속 들어|말을 들어|끊어도/,
            answer:
              "처음에는 고객의 말을 끊지 않고 핵심 불편을 확인해 주세요. 같은 말이 반복되면 “말씀하신 내용을 확인했습니다”라고 정리한 뒤 해결 방법을 안내하면 됩니다."
          },
          {
            test: /뭐라고|사과|말하면|예시/,
            answer:
              "“많이 기다리게 해 드려 죄송합니다. 주문 상태를 바로 확인하고 있으며 약 5분 안에 준비해 드리겠습니다.”라고 말해 보세요."
          },
          {
            test: /소리|욕설|위협|계속 화/,
            answer:
              "큰 소리나 욕설이 계속되면 혼자 감당하지 마세요. 안전한 거리를 유지하고 관리자나 동료에게 즉시 도움을 요청하세요."
          },
          {
            test: /관리자|언제 불러/,
            answer:
              "고객이 위협적인 행동을 하거나, 환불이나 보상처럼 본인이 결정할 수 없는 요청을 하거나, 상황이 오래 해결되지 않을 때 관리자를 부르는 것이 좋습니다."
          },
          {
            test: /환불/,
            answer:
              "환불 기준을 임의로 약속하지 말고 매장 규정을 확인하세요. “환불 가능 여부를 관리자에게 바로 확인해 드리겠습니다.”라고 안내하면 됩니다."
          }
        ]
      },

      harassment: {
        title: "직장 내 불쾌한 말·성희롱 대응",

        first:
          "불쾌하게 느꼈다면 그 감정을 무시할 필요는 없어요. 본인의 잘못이 아닙니다. 안전한 장소로 이동하고, 가능하면 중단을 요청한 뒤 상황을 기록해 두세요.",

        replies: [
          {
            test: /예민|제가 잘못|내가 잘못|과민/,
            answer:
              "아니에요. 불쾌하게 느꼈다면 그 감정은 존중받아야 합니다. 상대의 부적절한 말이나 행동에 대한 책임은 상대에게 있습니다."
          },
          {
            test: /뭐라고|말해야|말하면|예시/,
            answer:
              "가능하고 안전하다면 “그런 말은 불편합니다. 앞으로 하지 말아 주세요.”라고 짧고 분명하게 말해 보세요."
          },
          {
            test: /참아|그냥 넘어/,
            answer:
              "참아야 할 필요는 없어요. 직접 말하기 어렵다면 자리를 피하고 관리자, 인사 담당자, 고충처리 담당자에게 도움을 요청하세요."
          },
          {
            test: /기록|메모|증거/,
            answer:
              "날짜, 시간, 장소, 상대가 한 말이나 행동, 목격자, 당시 본인의 대응을 가능한 한 구체적으로 적어 두세요. 관련 메시지가 있다면 삭제하지 않는 것이 좋습니다."
          },
          {
            test: /누구에게|어디에|신고/,
            answer:
              "관리자, 인사 담당자, 고충처리 담당자처럼 공식적으로 문제를 처리할 수 있는 사람에게 알리세요. 믿을 수 있는 동료와 함께 가도 됩니다."
          },
          {
            test: /증거가 없어|증거 없어/,
            answer:
              "증거가 부족해도 상담이나 신고를 요청할 수 있어요. 기억나는 내용을 최대한 구체적으로 기록하고 공식 담당자에게 사실 중심으로 설명해 주세요."
          },
          {
            test: /다시|또 그런|반복/,
            answer:
              "즉시 자리를 피하고 혼자 있지 마세요. 반복된 날짜와 내용을 추가로 기록한 뒤 책임자에게 다시 알리세요."
          }
        ]
      },

      smalltalk: {
        title: "동료와 스몰토크 시작하기",

        first:
          "처음부터 긴 대화를 할 필요는 없어요. 출근길, 점심, 날씨처럼 답하기 쉬운 주제로 짧은 질문 하나만 해 보세요.",

        replies: [
          {
            test: /먼저 뭐라고|시작|첫 말/,
            answer:
              "“오늘 출근길은 괜찮으셨어요?” 또는 “점심은 드셨어요?”처럼 가볍고 답하기 쉬운 질문으로 시작해 보세요."
          },
          {
            test: /짧게 대답|단답|대답이 짧/,
            answer:
              "상대가 짧게 답하면 억지로 이어 가지 않아도 괜찮아요. “그렇군요. 오늘도 잘 부탁드립니다.”라고 자연스럽게 마무리하세요."
          },
          {
            test: /끊기|어색|대화가 끝/,
            answer:
              "대화가 잠시 끊기는 것은 자연스러운 일이에요. 상대가 말한 단어 하나를 받아 짧게 반응하거나, 업무로 돌아가며 마무리하면 됩니다."
          },
          {
            test: /물어보면 안|피해야|금지/,
            answer:
              "처음에는 연애, 결혼, 외모, 건강, 정치처럼 개인적이거나 민감한 질문은 피하는 것이 좋아요."
          },
          {
            test: /끝내|마무리/,
            answer:
              "“이제 업무 준비해야겠네요. 오늘도 잘 부탁드립니다.”처럼 짧게 인사하며 끝내면 자연스럽습니다."
          },
          {
            test: /어색해 보여|긴장|부자연/,
            answer:
              "조금 어색해 보여도 괜찮아요. 짧게 인사하고 질문 하나만 하는 것부터 반복하면 점점 편해집니다."
          }
        ]
      }
    };

    const messages =
      document.getElementById("messages");

    const input =
      document.getElementById("input");

    const quickButtons =
      document.getElementById("quickButtons");

    let currentScenario = null;

    function classify(text) {
      const value = text.toLowerCase();

      if (
        /음료|주문.*잘못|잘못.*만들|제조.*실수/.test(value)
      ) {
        return "order";
      }

      if (
        /늦|지연|기다|화.*내|항의|고객.*화|손님.*화/.test(value)
      ) {
        return "delay";
      }

      if (
        /성희롱|성적|불쾌.*말|신체.*접촉|농담/.test(value)
      ) {
        return "harassment";
      }

      if (
        /스몰토크|대화.*어려|무슨 말|동료.*대화|어색/.test(value)
      ) {
        return "smalltalk";
      }

      return null;
    }

    function escapeHtml(text) {
      return text.replace(
        /[&<>"']/g,
        (character) =>
          ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          })[character]
      );
    }

    function addUser(text) {
      messages.insertAdjacentHTML(
        "beforeend",
        `
          <div class="message user">
            <div class="bubble">
              ${escapeHtml(text)}
            </div>
          </div>
        `
      );

      scrollBottom();
    }

    function addTyping() {
      const element =
        document.createElement("div");

      element.className = "message bot";
      element.id = "typing";

      element.innerHTML = `
        <div class="bubble">
          <span class="typing">
            <i></i>
            <i></i>
            <i></i>
          </span>
        </div>
      `;

      messages.appendChild(element);
      scrollBottom();
    }

    function addBotText(text) {
      const typing =
        document.getElementById("typing");

      if (typing) {
        typing.remove();
      }

      messages.insertAdjacentHTML(
        "beforeend",
        `
          <div class="message bot">
            <div class="bubble">
              ${escapeHtml(text).replace(/\n/g, "<br>")}
            </div>
          </div>
        `
      );

      scrollBottom();
    }

    function scrollBottom() {
      messages.scrollTop =
        messages.scrollHeight;
    }

    function getFollowUpAnswer(
      scenario,
      text
    ) {
      const data =
        conversations[scenario];

      for (const item of data.replies) {
        if (item.test.test(text)) {
          return item.answer;
        }
      }

      if (/처음부터|다시 알려/.test(text)) {
        return data.first;
      }

      if (/쉽게|한 문장/.test(text)) {
        return (
          data.first.split(". ")[0] + "."
        );
      }

      return (
        `현재 상황은 “${data.title}”로 이해하고 있어요. ` +
        "무엇을 잘못했는지, 뭐라고 말해야 하는지, " +
        "관리자에게 알려야 하는지처럼 구체적으로 물어보면 " +
        "이어서 답해 드릴게요."
      );
    }

    function submit(text) {
      const source =
        typeof text === "string"
          ? text
          : input.value;

      const value = source.trim();

      if (!value) {
        return;
      }

      addUser(value);

      input.value = "";

      addTyping();

      const detected =
        classify(value);

      let answer;

      if (detected) {
        currentScenario = detected;
        answer =
          conversations[detected].first;
      } else if (currentScenario) {
        answer =
          getFollowUpAnswer(
            currentScenario,
            value
          );
      } else {
        answer =
          "어떤 상황인지 먼저 알려 주세요. " +
          "예: ‘카페에서 음료를 잘못 만들었어요’, " +
          "‘손님이 오래 기다렸다며 화를 내요’처럼 입력해 보세요.";
      }

      document
        .querySelectorAll(".scenario")
        .forEach((button) => {
          button.classList.toggle(
            "active",
            button.dataset.key ===
              currentScenario
          );
        });

      window.setTimeout(() => {
        addBotText(answer);
      }, 650);
    }

    function setQuickButtons() {
      quickButtons.innerHTML = `
        <button data-text="내가 뭘 잘못한 거예요?">
          내가 뭘 잘못한 거예요?
        </button>

        <button data-text="뭐라고 말하면 돼요?">
          뭐라고 말하면 돼요?
        </button>

        <button data-text="관리자에게 알려야 하나요?">
          관리자에게 알려야 하나요?
        </button>

        <button data-text="다음부터는 어떻게 해야 해요?">
          다음부터는 어떻게 해야 해요?
        </button>
      `;

      document
        .querySelectorAll(".quick button")
        .forEach((button) => {
          button.onclick = () => {
            submit(button.dataset.text);
          };
        });
    }

    setQuickButtons();

    document
      .getElementById("send")
      .onclick = () => {
        submit();
      };

    input.addEventListener(
      "keydown",
      (event) => {
        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {
          event.preventDefault();
          submit();
        }
      }
    );

    document
      .querySelectorAll(".scenario")
      .forEach((button) => {
        button.onclick = () => {
          const scenarioTexts = {
            order:
              "카페에서 음료를 잘못 만들었어요",

            delay:
              "손님이 오래 기다렸다며 화를 내요",

            harassment:
              "직장 동료가 불쾌한 성적 농담을 했어요",

            smalltalk:
              "동료와 무슨 대화를 해야 할지 모르겠어요"
          };

          submit(
            scenarioTexts[
              button.dataset.key
            ]
          );
        };
      });

    document
      .getElementById("reset")
      .onclick = () => {
        currentScenario = null;

        messages.innerHTML = `
          <div class="message bot">
            <div class="bubble">
              <div class="welcome">
                <h3>
                  어떤 상황이 발생했나요?
                </h3>

                <p>
                  왼쪽에서 상황을 선택하거나 아래 입력창에
                  문제를 입력하세요. 이후 질문도 같은 상황에
                  맞춰 이어서 답합니다.
                </p>
              </div>
            </div>
          </div>
        `;

        document
          .querySelectorAll(".scenario")
          .forEach((button) => {
            button.classList.remove(
              "active"
            );
          });

        input.focus();
      };
  </script>
</body>
</html>
